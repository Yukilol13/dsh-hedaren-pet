<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>和大人 · 菜单</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    user-select: none; -webkit-user-select: none;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  #menu {
    width: 100%;
    padding: 6px;
    border-radius: 12px;
    background: rgba(28, 30, 36, .97);
    color: #f6f1e6;
    font-size: 13px;
    box-shadow: 0 14px 40px rgba(0,0,0,.5);
  }
  #menu .muted { color: rgba(246,241,230,.55); font-size: 11px; padding: 3px 10px; }
  #menu button {
    display: block; width: 100%; text-align: left;
    padding: 7px 10px; border: 0; border-radius: 8px;
    background: transparent; color: inherit; font: inherit; cursor: pointer;
  }
  #menu button:hover { background: rgba(255,255,255,.10); }
  #menu .sep { height: 1px; margin: 5px 4px; background: rgba(255,255,255,.12); }
  #menu .cat span { float: right; opacity: .55; margin-left: 16px; }
  .scaleRow {
    display: flex; align-items: center; gap: 7px;
    padding: 3px 8px 7px; font-size: 11px; color: rgba(246,241,230,.62);
  }
  .scaleRow input[type="range"] {
    -webkit-appearance: none; appearance: none; flex: 1; min-width: 70px;
    height: 4px; border-radius: 999px; background: rgba(255,255,255,.22); outline: none;
  }
  .scaleRow input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
    background: #d4af37; box-shadow: 0 0 0 2px rgba(0,0,0,.4); cursor: pointer;
  }
  #scaleVal, #settleVal { min-width: 40px; text-align: right; color: rgba(246,241,230,.85); }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 999px; }
  ::-webkit-scrollbar-track { background: transparent; }</style>
</head>
<body>
<div id="menu"></div>
<script>
const $ = (s) => document.querySelector(s)
const menu = $('#menu')

// 只有这些动作循环播放，其余动作播放一遍就回待机
const LOOPING_ANIMS = new Set([
  '待机-呼吸',
  '待机-捻须',
  '待机-背手',
  '待机-打哈欠',
  '待机-数朝珠',
])

const FACE_LINES = {
  '01-招牌笑': '皇上圣明，奴才给您请安了。',
  '02-算计': '这笔账，奴才得好好算算……',
  '03-惊讶': '哎哟，这可了不得了！',
  '04-委屈': '奴才冤枉啊……',
  '05-得意': '皇上圣明！皇上说得太对了！',
  '06-恼怒': '这事儿，奴才可不答应！',
  '07-害怕': '皇上明鉴，奴才知错了！',
  '08-困倦': '夜深了，奴才实在撑不住了……',
}

/** 表情的脸谱名，用和大人的口气叫出来 */
const FACE_LABELS = {
  '01-招牌笑': '招牌笑脸迎皇上',
  '02-算计': '肚子里拨算盘',
  '03-惊讶': '吓得一激灵',
  '04-委屈': '委屈巴巴要掉泪',
  '05-得意': '尾巴翘到天上',
  '06-恼怒': '恼了，要骂人了',
  '07-害怕': '腿肚子直转筋',
  '08-困倦': '困得直点头',
}

const TREE = {
  rite: {
    label: '给皇上请安',
    items: [
      { label: '规规矩矩行个大礼', action: 'play', anim: '点击-拱手', text: '皇上圣明，奴才给您行礼了！' },
      { label: '献件宝贝给皇上瞧', action: 'play', anim: '递古董', text: '皇上，这件青花瓷瓶，奴才特意给您寻来的。' },
      { label: '趴下磕头表忠心', action: 'play', anim: '跪舔', text: '皇上万岁，奴才给您磕头了！' },
      { label: '马屁拍到马蹄上', action: 'play', anim: '拍马屁', text: '皇上圣明！皇上说得太对了！' },
      { label: '被参一本，奴才冤枉', action: 'play', anim: '被参一本', text: '皇上明鉴！奴才冤枉啊！' },
    ],
  },
  life: {
    label: '奴才的钱袋子',
    items: [
      { label: '逛琉璃厂淘宝贝', action: 'play', anim: '琉璃厂', text: '这件东西，才是真正的宝贝。' },
      { label: '扒拉算盘算细账', action: 'play', anim: '常服算账', text: '这笔账，奴才得好好算算……' },
      { label: '数银子数到手软', action: 'play', anim: '府里数银', text: '这一堆银子，都是奴才给您攒的！' },
      { label: '袖子一抖塞银票', action: 'play', anim: '塞银票', text: '这银票，奴才替您收着……' },
      { label: '常服回府喊小月', action: 'play', anim: '常服进门', text: '小月姑娘！小月姑娘——' },
      { label: '手欠，自己打自己', action: 'play', anim: '银票打手', text: '我怎么就管不住这手呢！' },
      { label: '跟老纪斗两句嘴', action: 'play', anim: '斗嘴', text: '皇上，奴才这张嘴可不饶人！' },
    ],
  },
  work: {
    label: '歇着的时候',
    items: [
      { label: '就这么喘口气', action: 'play', anim: '待机-呼吸' },
      { label: '捻着胡子琢磨事', action: 'play', anim: '待机-捻须' },
      { label: '背着手装深沉', action: 'play', anim: '待机-背手' },
      { label: '张嘴打个大哈欠', action: 'play', anim: '待机-打哈欠' },
      { label: '数朝珠解解闷', action: 'play', anim: '待机-数朝珠' },
    ],
  },
  face: {
    label: '变个脸给皇上看',
    items: Object.keys(FACE_LINES).map((face) => ({
      label: FACE_LABELS[face] || face.slice(3),
      action: 'face',
      face,
      text: FACE_LINES[face],
    })),
  },
}

let category = null
let scale = 1
let scaleDragging = false
let throwSettleMs = 50
let jailThreshold = 10

const SETTLE_MIN = 50
const SETTLE_MAX = 500

async function refreshSnapshot() {
  try {
    const s = await window.heshen.readState()
    scale = Math.max(0.7, Math.min(1.5, Number(s.scale) || 1))
      throwSettleMs = Math.max(SETTLE_MIN, Math.min(SETTLE_MAX, Math.round(Number(s.throwSettleMs) || SETTLE_MIN)))
    jailThreshold = Math.max(0, Math.min(10000, Math.round((Number(s.jailThreshold) || 10) * 100) / 100))
  } catch {}
}

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag)
  for (const [k, v] of Object.entries(props)) {
    if (k === 'text') node.textContent = v
    else if (k === 'className') node.className = v
    else if (k.startsWith('data-')) node.setAttribute(k, v)
    else node[k] = v
  }
  for (const c of children) node.appendChild(c)
  return node
}

function resizeToContent() {
  requestAnimationFrame(() => {
    const height = Math.ceil(menu.getBoundingClientRect().height) + 2
    window.heshen.resizeMenu(height)
  })
}

function renderMain() {
  category = null
  menu.innerHTML = ''
  menu.appendChild(el('div', { className: 'muted', text: '和大人' }))
  // 大小 / 甩飞阈值 / 亏空阈值 这些设置项都搬去「DSH 设置 → 和大人府邸」了，菜单只留动作。
  menu.appendChild(
    el('div', { className: 'muted', text: '要调教奴才：DSH 设置 → 和大人府邸' }),
  )

  menu.appendChild(
    el('button', { className: 'cat', text: '跟奴才说两句 ', onclick: () => act({ action: 'chat' }) }),
  )
  menu.appendChild(
    el('button', { className: 'cat', text: '查询国库 ', onclick: () => act({ action: 'treasury' }) }),
  )
  menu.appendChild(el('div', { className: 'sep' }))

  for (const [key, group] of Object.entries(TREE)) {
    const btn = el('button', { className: 'cat', text: group.label })
    btn.appendChild(el('span', { text: '›' }))
    btn.addEventListener('click', () => {
      category = key
      renderSub()
    })
    menu.appendChild(btn)
  }

  menu.appendChild(el('div', { className: 'sep' }))
  const quit = el('button', { className: 'cat', text: '奴才告退 ', onclick: () => act({ action: 'quit' }) })
  quit.appendChild(el('span', { text: '›' }))
  menu.appendChild(quit)
  resizeToContent()
}

function renderSub() {
  const group = TREE[category]
  if (!group) return renderMain()
  menu.innerHTML = ''
  const back = el('button', { className: 'muted', text: `‹ ${group.label}` })
  back.addEventListener('click', () => renderMain())
  menu.appendChild(back)
  for (const item of group.items) {
    const btn = el('button', { text: item.label })
    btn.addEventListener('click', () =>
      act({
        action: item.action,
        data: {
          anim: item.anim,
          face: item.face,
          text: item.text,
          // 只有「待机/循环」类动作循环播放，其余动作播一遍就回待机
          loop: item.loop !== undefined ? item.loop : LOOPING_ANIMS.has(item.anim),
        },
      }),
    )
    menu.appendChild(btn)
  }
  resizeToContent()
}

function act(payload) {
  window.heshen.menuAction(payload)
}

window.heshen.onMenuOpened(async () => {
  await refreshSnapshot()
  renderMain()
  scaleDragging = false
})

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') window.heshen.closeMenu()
})
window.addEventListener('contextmenu', (e) => e.preventDefault())

async function boot() {
  await refreshSnapshot()
  renderMain()
}
boot()
</script>
</body>
</html>
